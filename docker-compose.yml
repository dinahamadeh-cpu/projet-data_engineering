services:

  mongodb:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: ./scraper
    depends_on:
      mongodb:
        condition: service_healthy
    command: python scraper.py
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    restart: "no"

  app:
    build: ./app
    depends_on:
      scraper:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongodb:27017

volumes:
  mongo_data:
